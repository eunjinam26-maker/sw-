<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piece of moment — 나만의 아카이브</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111111;
    --surface: #1c1c1c;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #e8e8e8;
    --text-dim: #888;
    --text-dimmer: #555;
    --accent: #f5c518; /* neon yellow for stars */
    --accent-soft: rgba(245,197,24,0.12);
    --white: #ffffff;
    --radius: 10px;
    --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 36px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(17,17,17,0.92);
    backdrop-filter: blur(14px);
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--white);
  }
  .logo span { color: var(--accent); }
  .header-count {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 400;
  }

  /* ── LAYOUT ── */
  .app {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 0;
    min-height: calc(100vh - 65px);
  }

  /* ── SIDEBAR FORM ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 32px 28px;
    position: sticky;
    top: 65px;
    height: calc(100vh - 65px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .form-title {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: var(--white);
    margin-bottom: 24px;
  }
  .form-title small {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--text-dimmer);
    font-weight: 400;
    margin-top: 3px;
  }

  /* Category tabs */
  .category-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
  }
  .cat-btn {
    flex: 1;
    padding: 8px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    letter-spacing: 0.01em;
  }
  .cat-btn:hover { border-color: #555; color: var(--text); }
  .cat-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Form fields */
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 7px;
  }
  .field input[type="text"],
  .field input[type="date"],
  .field textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    transition: border-color var(--transition);
    outline: none;
    -webkit-appearance: none;
  }
  .field input[type="date"] {
    color-scheme: dark;
  }
  .field input:focus,
  .field textarea:focus {
    border-color: var(--accent);
  }
  .field textarea {
    resize: vertical;
    min-height: 80px;
  }

  /* Star rating */
  .star-rating {
    display: flex;
    gap: 4px;
  }
  .star {
    font-size: 26px;
    cursor: pointer;
    color: var(--border);
    transition: color var(--transition), transform 0.15s;
    line-height: 1;
    user-select: none;
  }
  .star:hover, .star.lit { color: var(--accent); }
  .star:active { transform: scale(0.88); }

  /* Image upload */
  .upload-area {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color var(--transition), background var(--transition);
    position: relative;
    overflow: hidden;
  }
  .upload-area:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .upload-area input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-icon { font-size: 28px; display: block; margin-bottom: 6px; }
  .upload-label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .upload-sub { font-size: 11px; color: var(--text-dimmer); }
  .upload-preview {
    width: 100%;
    max-height: 160px;
    object-fit: cover;
    border-radius: 6px;
    display: none;
  }
  .url-input {
    margin-top: 10px;
  }

  /* Submit */
  .btn-save {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #111;
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: opacity var(--transition), transform 0.15s;
    margin-top: 6px;
  }
  .btn-save:hover { opacity: 0.88; }
  .btn-save:active { transform: scale(0.98); }

  /* ── GALLERY ── */
  .gallery {
    padding: 28px 32px;
  }
  .gallery-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .gallery-title {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: var(--white);
  }

  /* Filter tabs */
  .filter-tabs {
    display: flex;
    gap: 6px;
  }
  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: var(--transition);
    font-weight: 500;
  }
  .filter-btn:hover { color: var(--text); border-color: #555; }
  .filter-btn.active {
    background: var(--white);
    color: #111;
    border-color: var(--white);
    font-weight: 600;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }

  /* Card */
  .card {
    position: relative;
    aspect-ratio: 2/3;
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: transform var(--transition), box-shadow var(--transition);
  }
  .card:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    z-index: 2;
  }
  .card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }
  .card:hover .card-img { transform: scale(1.06); }

  /* No image placeholder */
  .card-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface2);
    color: var(--text-dimmer);
    font-size: 36px;
    gap: 10px;
  }
  .card-placeholder span {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dimmer);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* Overlay */
  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.93) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.05) 100%);
    opacity: 0;
    transition: opacity var(--transition);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 14px 13px;
  }
  .card:hover .card-overlay { opacity: 1; }

  .card-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(0,0,0,0.6);
    color: var(--accent);
    border: 1px solid var(--accent);
    backdrop-filter: blur(4px);
  }

  .card-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.15);
    color: #aaa;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: var(--transition);
    backdrop-filter: blur(4px);
    z-index: 5;
  }
  .card:hover .card-delete { opacity: 1; }
  .card-delete:hover { background: rgba(200,50,50,0.8); color: white; }

  .overlay-title {
    font-family: 'DM Serif Display', serif;
    font-size: 15px;
    color: var(--white);
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .overlay-date {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 5px;
  }
  .overlay-stars {
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .overlay-review {
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Empty state */
  .empty-state {
    grid-column: 1/-1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    color: var(--text-dimmer);
    text-align: center;
    gap: 12px;
  }
  .empty-icon { font-size: 52px; opacity: 0.4; }
  .empty-title {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--text-dim);
  }
  .empty-sub { font-size: 13px; line-height: 1.6; max-width: 280px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #111;
    padding: 12px 24px;
    border-radius: 40px;
    font-weight: 700;
    font-size: 14px;
    z-index: 999;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Scrollbar global */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

  /* Responsive */
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: static;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .gallery { padding: 24px 20px; }
    header { padding: 18px 20px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
  @media (max-width: 500px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .filter-tabs { flex-wrap: wrap; }
  }

  /* Animate cards in */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card { animation: fadeUp 0.4s ease both; }

  /* ── DETAIL MODAL ── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 720px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    transform: translateY(24px) scale(0.97);
    transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .modal-backdrop.open .modal { transform: translateY(0) scale(1); }

  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    z-index: 10;
  }
  .modal-close:hover { background: rgba(255,255,255,0.14); color: var(--white); }

  .modal-hero {
    position: relative;
    width: 100%; height: 300px;
    overflow: hidden;
    border-radius: 16px 16px 0 0;
  }
  .modal-hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-hero-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface2);
    font-size: 64px;
  }
  .modal-hero-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(to top, var(--surface) 0%, transparent 55%);
  }
  .modal-hero-badge {
    position: absolute; top: 16px; left: 16px;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 5px;
    background: rgba(0,0,0,0.6);
    color: var(--accent); border: 1px solid var(--accent);
    backdrop-filter: blur(4px);
  }

  .modal-body { padding: 24px 32px 36px; }

  .modal-meta {
    display: flex; align-items: flex-start;
    justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px; color: var(--white);
    line-height: 1.2; flex: 1; min-width: 200px;
  }
  .modal-right {
    display: flex; flex-direction: column;
    align-items: flex-end; gap: 5px; flex-shrink: 0;
  }
  .modal-stars { font-size: 22px; color: var(--accent); letter-spacing: 2px; }
  .modal-stars-none { font-size: 13px; color: var(--text-dimmer); font-style: italic; }

  .modal-divider { height: 1px; background: var(--border); margin: 20px 0; }

  .modal-info-row { display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 20px; }
  .modal-info-item { display: flex; flex-direction: column; gap: 4px; }
  .modal-info-label {
    font-size: 11px; font-weight: 600;
    color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.08em;
  }
  .modal-info-value { font-size: 14px; color: var(--text); font-weight: 500; }

  .modal-review-label {
    font-size: 11px; font-weight: 600;
    color: var(--text-dimmer); text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 10px;
  }
  .modal-review-text {
    font-size: 15px; color: var(--text);
    line-height: 1.8; white-space: pre-wrap;
    padding: 16px 20px;
    background: var(--surface2);
    border-radius: var(--radius);
    border-left: 3px solid var(--accent);
  }
  .modal-no-review { font-size: 14px; color: var(--text-dimmer); font-style: italic; }

  .modal-actions { display: flex; gap: 10px; margin-top: 28px; }
  .btn-modal-delete {
    padding: 10px 20px;
    background: transparent;
    border: 1px solid #5a2020; color: #e07070;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 600;
    cursor: pointer; transition: var(--transition);
  }
  .btn-modal-delete:hover { background: rgba(200,50,50,0.15); border-color: #c05050; }

  .modal-saved-at {
    font-size: 11px; color: var(--text-dimmer);
    margin-top: 20px; text-align: right;
  }

  @media (max-width: 600px) {
    .modal-body { padding: 18px 20px 28px; }
    .modal-hero { height: 200px; }
    .modal-title { font-size: 22px; }
    .modal-stars { font-size: 18px; }
  }

  /* ── EDIT MODE ── */
  .modal-mode-tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .modal-mode-btn {
    flex: 1;
    padding: 9px 0;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    letter-spacing: 0.02em;
  }
  .modal-mode-btn:first-child { border-right: 1px solid var(--border); }
  .modal-mode-btn.active {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .modal-mode-btn:hover:not(.active) { background: rgba(255,255,255,0.04); color: var(--text); }

  /* Edit panel */
  .edit-panel { display: none; }
  .edit-panel.visible { display: block; }
  .view-panel { display: block; }
  .view-panel.hidden { display: none; }

  .edit-field { margin-bottom: 16px; }
  .edit-field label {
    display: block;
    font-size: 11px; font-weight: 600;
    color: var(--text-dimmer);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .edit-field input[type="text"],
  .edit-field input[type="date"],
  .edit-field textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color var(--transition);
    -webkit-appearance: none;
  }
  .edit-field input[type="date"] { color-scheme: dark; }
  .edit-field input:focus, .edit-field textarea:focus { border-color: var(--accent); }
  .edit-field textarea { resize: vertical; min-height: 90px; }

  .edit-cat-tabs { display: flex; gap: 6px; }
  .edit-cat-btn {
    flex: 1; padding: 8px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    cursor: pointer; transition: var(--transition);
  }
  .edit-cat-btn:hover { border-color: #555; color: var(--text); }
  .edit-cat-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  .edit-star-rating { display: flex; gap: 4px; }
  .edit-star {
    font-size: 26px; cursor: pointer;
    color: var(--border);
    transition: color var(--transition), transform 0.15s;
    line-height: 1; user-select: none;
  }
  .edit-star:active { transform: scale(0.88); }

  /* Edit image area */
  .edit-upload-area {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 14px;
    text-align: center;
    cursor: pointer;
    transition: border-color var(--transition), background var(--transition);
    position: relative;
    overflow: hidden;
  }
  .edit-upload-area:hover { border-color: var(--accent); background: var(--accent-soft); }
  .edit-upload-area input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .edit-upload-thumb {
    width: 100%; max-height: 120px;
    object-fit: cover; border-radius: 6px;
    display: none;
  }
  .edit-upload-placeholder { font-size: 13px; color: var(--text-dim); }
  .edit-url-input { margin-top: 8px; }

  /* Btn save edit */
  .btn-save-edit {
    width: 100%; padding: 13px;
    background: var(--accent); color: #111;
    border: none; border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.03em;
    transition: opacity var(--transition), transform 0.15s;
    margin-top: 6px;
  }
  .btn-save-edit:hover { opacity: 0.88; }
  .btn-save-edit:active { transform: scale(0.98); }

  .edit-divider { height: 1px; background: var(--border); margin: 20px 0; }
</style>
</head>
<body>

<header>
  <div class="logo">piece of <span>moment</span></div>
  <span class="header-count" id="headerCount">기록 0개</span>
</header>

<div class="app">
  <!-- ── SIDEBAR FORM ── -->
  <aside class="sidebar">
    <div class="form-title">

  <!-- ── GALLERY ── -->
  <main class="gallery">

      <div class="filter-tabs" id="filterTabs">
        <button class="filter-btn active" data-filter="전체">전체</button>
        <button class="filter-btn" data-filter="영화">영화</button>
        <button class="filter-btn" data-filter="드라마">드라마</button>
        <button class="filter-btn" data-filter="공연">공연</button>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">&#x2715;</button>
    <div class="modal-hero" id="modalHero"></div>
    <div class="modal-body">

      <!-- Mode tabs -->
      <div class="modal-mode-tabs">
        <button class="modal-mode-btn active" id="modeBtnView">&#x1F4CB; 상세 보기</button>
        <button class="modal-mode-btn" id="modeBtnEdit">&#x270F;&#xFE0F; 수정하기</button>
      </div>

      <!-- ── VIEW PANEL ── -->
      <div class="view-panel" id="viewPanel">
        <div class="modal-meta">
          <div class="modal-title" id="modalTitle"></div>
          <div class="modal-right">
            <div class="modal-stars" id="modalStars"></div>
          </div>
        </div>
        <div class="modal-divider"></div>
        <div class="modal-info-row" id="modalInfoRow"></div>
        <div id="modalReviewSection"></div>
        <div class="modal-actions">
          <button class="btn-modal-delete" id="modalDeleteBtn">&#x1F5D1; 기록 삭제</button>

      <!-- ── EDIT PANEL ── -->
      <div class="edit-panel" id="editPanel">

        <div class="edit-field">
          <label>카테고리</label>
          <div class="edit-cat-tabs" id="editCatTabs">
            <button class="edit-cat-btn" data-cat="영화">&#x1F3AC; 영화</button>
            <button class="edit-cat-btn" data-cat="드라마">&#x1F4FA; 드라마</button>
            <button class="edit-cat-btn" data-cat="공연">&#x1F3AD; 공연</button>
          </div>
        </div>

        <div class="edit-field">
          <label>제목</label>
          <input type="text" id="editTitle" placeholder="작품 제목">
        </div>

        <div class="edit-field">
          <label>관람일</label>
          <input type="date" id="editDate">
        </div>

        <div class="edit-field">
          <label>별점</label>
          <div class="edit-star-rating" id="editStarRating">
            <span class="edit-star" data-i="1">&#x2605;</span>
            <span class="edit-star" data-i="2">&#x2605;</span>
            <span class="edit-star" data-i="3">&#x2605;</span>
            <span class="edit-star" data-i="4">&#x2605;</span>
            <span class="edit-star" data-i="5">&#x2605;</span>
          </div>
        </div>

        <div class="edit-field">
          <label>포스터 / 티켓 이미지</label>
          <div class="edit-upload-area" id="editUploadArea">
            <input type="file" id="editFile" accept="image/*">
            <img class="edit-upload-thumb" id="editUploadThumb" alt="미리보기">
            <span class="edit-upload-placeholder" id="editUploadPlaceholder">&#x1F5BC;&#xFE0F; 클릭하여 이미지 변경</span>
          </div>
          <div class="edit-url-input">
            <input type="text" id="editUrl" placeholder="또는 이미지 URL 입력" style="font-size:12px;padding:8px 12px;">
          </div>
        </div>

        <div class="edit-field">
          <label>감상평</label>
          <textarea id="editReview" placeholder="감상평을 입력하세요…"></textarea>
        </div>

        <button class="btn-save-edit" id="btnSaveEdit">수정 저장하기</button>

        <div class="edit-divider"></div>
        <div class="modal-actions">
          <button class="btn-modal-delete" id="editDeleteBtn">&#x1F5D1; 기록 삭제</button>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast">✓ 저장되었습니다</div>

<script>
  // ── STATE ──
  const STORAGE_KEY = 'culturelog_v1';
  let records = [];
  let selectedCat = '영화';
  let selectedStars = 0;
  let currentFilter = '전체';

  // ── INIT ──
  function init() {
    loadFromStorage();
    setTodayDate();
    bindEvents();
    renderGrid();
    updateCount();
  }

  function setTodayDate() {
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('inputDate').value = today;
  }

  // ── STORAGE ──
  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      records = raw ? JSON.parse(raw) : [];
    } catch(e) { records = []; }
  }

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    } catch(e) {
      showToast('⚠️ 저장 공간이 부족합니다 (이미지 용량 확인)');
    }
  }

  // ── BIND EVENTS ──
  function bindEvents() {
    // Category selection
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCat = btn.dataset.cat;
      });
    });

    // Star rating
    const stars = document.querySelectorAll('.star');
    stars.forEach(star => {
      star.addEventListener('click', () => {
        selectedStars = parseInt(star.dataset.i);
        updateStars();
      });
      star.addEventListener('mouseenter', () => {
        const hoverI = parseInt(star.dataset.i);
        stars.forEach(s => {
          s.style.color = parseInt(s.dataset.i) <= hoverI ? 'var(--accent)' : 'var(--border)';
        });
      });
    });
    document.querySelector('.star-rating').addEventListener('mouseleave', updateStars);

    // File upload
    document.getElementById('inputFile').addEventListener('change', handleFileUpload);

    // URL input
    document.getElementById('inputUrl').addEventListener('input', (e) => {
      if (e.target.value.trim()) showPreview(e.target.value.trim());
    });

    // Save
    document.getElementById('btnSave').addEventListener('click', saveRecord);

    // Filter tabs
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderGrid();
      });
    });
  }

  function updateStars(value) {
    const v = value !== undefined ? value : selectedStars;
    document.querySelectorAll('.star').forEach(s => {
      s.style.color = parseInt(s.dataset.i) <= v ? 'var(--accent)' : 'var(--border)';
    });
  }

  // ── FILE UPLOAD ──
  let uploadedImageData = null;

  function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      uploadedImageData = ev.target.result;
      showPreview(uploadedImageData);
      document.getElementById('inputUrl').value = '';
    };
    reader.readAsDataURL(file);
  }

  function showPreview(src) {
    const preview = document.getElementById('uploadPreview');
    const area = document.getElementById('uploadArea');
    preview.src = src;
    preview.style.display = 'block';
    area.querySelector('.upload-icon').style.display = 'none';
    area.querySelector('.upload-label').style.display = 'none';
    area.querySelector('.upload-sub').style.display = 'none';
  }

  function getImageSrc() {
    if (uploadedImageData) return uploadedImageData;
    const url = document.getElementById('inputUrl').value.trim();
    if (url) return url;
    return null;
  }

  // ── SAVE RECORD ──
  function saveRecord() {
    const title = document.getElementById('inputTitle').value.trim();
    if (!title) {
      document.getElementById('inputTitle').focus();
      shakeField('inputTitle');
      return;
    }

    const record = {
      id: Date.now(),
      category: selectedCat,
      title,
      date: document.getElementById('inputDate').value,
      stars: selectedStars,
      image: getImageSrc(),
      review: document.getElementById('inputReview').value.trim()
    };

    records.unshift(record);
    saveToStorage();
    renderGrid();
    updateCount();
    resetForm();
    showToast('✓ 저장되었습니다');
  }

  function shakeField(id) {
    const el = document.getElementById(id);
    el.style.borderColor = '#e74c3c';
    el.style.animation = 'none';
    setTimeout(() => { el.style.borderColor = ''; }, 1500);
  }

  function resetForm() {
    document.getElementById('inputTitle').value = '';
    document.getElementById('inputReview').value = '';
    document.getElementById('inputUrl').value = '';
    document.getElementById('inputFile').value = '';
    uploadedImageData = null;
    selectedStars = 0;
    updateStars(0);
    setTodayDate();
    const preview = document.getElementById('uploadPreview');
    preview.style.display = 'none';
    preview.src = '';
    document.getElementById('uploadArea').querySelector('.upload-icon').style.display = '';
    document.getElementById('uploadArea').querySelector('.upload-label').style.display = '';
    document.getElementById('uploadArea').querySelector('.upload-sub').style.display = '';
  }

  // ── RENDER GRID ──
  function renderGrid() {
    const grid = document.getElementById('grid');
    const filtered = currentFilter === '전체' ? records : records.filter(r => r.category === currentFilter);

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">${currentFilter === '전체' ? '🎬' : currentFilter === '영화' ? '🎬' : currentFilter === '드라마' ? '📺' : '🎭'}</div>
          <div class="empty-title">아직 기록이 없어요</div>
          <div class="empty-sub">좌측 폼에서 첫 번째 감상 기록을 남겨보세요. 포스터가 가득 찬 아카이브가 될 거예요.</div>
        </div>`;
      return;
    }

    grid.innerHTML = filtered.map((r, i) => buildCard(r, i)).join('');

    // Bind delete buttons
    grid.querySelectorAll('.card-delete').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteRecord(parseInt(btn.dataset.id));
      });
    });

    // Bind card click -> open detail modal
    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        const id = parseInt(card.dataset.id);
        openModal(id);
      });
    });
  }

  function buildCard(r, i) {
    const starsStr = '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars);
    const catIcon = r.category === '영화' ? '🎬' : r.category === '드라마' ? '📺' : '🎭';
    const dateStr = r.date ? new Date(r.date).toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }) : '';

    const imgHtml = r.image
      ? `<img class="card-img" src="${r.image}" alt="${escHtml(r.title)}" loading="lazy">`
      : `<div class="card-placeholder">${catIcon}<span>${escHtml(r.category)}</span></div>`;

    return `
      <div class="card" data-id="${r.id}" style="animation-delay: ${Math.min(i * 0.04, 0.5)}s">
        ${imgHtml}
        <span class="card-badge">${catIcon} ${escHtml(r.category)}</span>
        <button class="card-delete" data-id="${r.id}" title="삭제">✕</button>
        <div class="card-overlay">
          <div class="overlay-title">${escHtml(r.title)}</div>
          ${dateStr ? `<div class="overlay-date">${dateStr}</div>` : ''}
          ${r.stars ? `<div class="overlay-stars">${starsStr}</div>` : ''}
          ${r.review ? `<div class="overlay-review">${escHtml(r.review)}</div>` : ''}
        </div>
      </div>`;
  }

  // ── DELETE ──
  function deleteRecord(id) {
    if (!confirm('이 기록을 삭제할까요?')) return;
    records = records.filter(r => r.id !== id);
    saveToStorage();
    renderGrid();
    updateCount();
    showToast('🗑️ 삭제되었습니다');
  }

  // ── HELPERS ──
  function updateCount() {
    document.getElementById('headerCount').textContent = `기록 ${records.length}개`;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── MODAL ──
  let currentModalId = null;
  let editUploadedImage = null;
  let editSelectedCat = '영화';
  let editSelectedStars = 0;

  function catIcon(cat) {
    return cat === '영화' ? '🎬' : cat === '드라마' ? '📺' : '🎭';
  }

  function openModal(id) {
    const r = records.find(rec => rec.id === id);
    if (!r) return;
    currentModalId = id;

    renderViewPanel(r);
    switchModalMode('view');

    document.getElementById('modalBackdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function renderViewPanel(r) {
    const icon = catIcon(r.category);
    const dateStr = r.date ? new Date(r.date).toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }) : '날짜 미기록';
    const starsStr = r.stars ? '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars) : null;

    // Hero
    const hero = document.getElementById('modalHero');
    if (r.image) {
      hero.innerHTML = `<img class="modal-hero-img" src="${r.image}" alt="${escHtml(r.title)}">
        <div class="modal-hero-gradient"></div>
        <span class="modal-hero-badge">${icon} ${escHtml(r.category)}</span>`;
    } else {
      hero.innerHTML = `<div class="modal-hero-placeholder">${icon}</div>
        <div class="modal-hero-gradient"></div>
        <span class="modal-hero-badge">${icon} ${escHtml(r.category)}</span>`;
    }

    document.getElementById('modalTitle').textContent = r.title;
    document.getElementById('modalStars').innerHTML = starsStr
      ? `<span style="color:var(--accent);font-size:22px;letter-spacing:2px">${starsStr}</span><span style="font-size:11px;color:var(--text-dimmer);margin-top:3px;display:block">${r.stars} / 5</span>`
      : `<span style="font-size:13px;color:var(--text-dimmer);font-style:italic">별점 없음</span>`;

    document.getElementById('modalInfoRow').innerHTML = `
      <div class="modal-info-item">
        <span class="modal-info-label">카테고리</span>
        <span class="modal-info-value">${icon} ${escHtml(r.category)}</span>
      </div>
      <div class="modal-info-item">
        <span class="modal-info-label">관람일</span>
        <span class="modal-info-value">${dateStr}</span>
      </div>`;

    const reviewSection = document.getElementById('modalReviewSection');
    reviewSection.innerHTML = r.review
      ? `<div class="modal-review-label">감상평</div><div class="modal-review-text">${escHtml(r.review)}</div>`
      : `<div class="modal-review-label">감상평</div><div class="modal-no-review">작성된 감상평이 없습니다.</div>`;

    document.getElementById('modalSavedAt').textContent =
      `기록일: ${new Date(r.id).toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}`;

    document.getElementById('modalDeleteBtn').onclick = () => { closeModal(); deleteRecord(r.id); };
  }

  function populateEditPanel(r) {
    editSelectedCat = r.category;
    editSelectedStars = r.stars || 0;
    editUploadedImage = null;

    // Category
    document.querySelectorAll('.edit-cat-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.cat === r.category);
    });

    document.getElementById('editTitle').value = r.title || '';
    document.getElementById('editDate').value = r.date || '';
    document.getElementById('editReview').value = r.review || '';
    document.getElementById('editUrl').value = '';

    // Stars
    updateEditStars(r.stars || 0);

    // Image thumb
    const thumb = document.getElementById('editUploadThumb');
    const placeholder = document.getElementById('editUploadPlaceholder');
    if (r.image) {
      thumb.src = r.image;
      thumb.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      thumb.style.display = 'none';
      thumb.src = '';
      placeholder.style.display = '';
    }

    document.getElementById('editDeleteBtn').onclick = () => { closeModal(); deleteRecord(r.id); };
  }

  function updateEditStars(val) {
    editSelectedStars = val;
    document.querySelectorAll('.edit-star').forEach(s => {
      s.style.color = parseInt(s.dataset.i) <= val ? 'var(--accent)' : 'var(--border)';
    });
  }

  function switchModalMode(mode) {
    const isEdit = mode === 'edit';
    document.getElementById('viewPanel').classList.toggle('hidden', isEdit);
    document.getElementById('editPanel').classList.toggle('visible', isEdit);
    document.getElementById('modeBtnView').classList.toggle('active', !isEdit);
    document.getElementById('modeBtnEdit').classList.toggle('active', isEdit);

    if (isEdit) {
      const r = records.find(rec => rec.id === currentModalId);
      if (r) populateEditPanel(r);
    }
  }

  function saveEdit() {
    if (!currentModalId) return;
    const idx = records.findIndex(r => r.id === currentModalId);
    if (idx === -1) return;

    const title = document.getElementById('editTitle').value.trim();
    if (!title) { document.getElementById('editTitle').focus(); return; }

    // Determine image
    let image = records[idx].image; // keep existing by default
    if (editUploadedImage) {
      image = editUploadedImage;
    } else {
      const urlVal = document.getElementById('editUrl').value.trim();
      if (urlVal) image = urlVal;
    }

    records[idx] = {
      ...records[idx],
      category: editSelectedCat,
      title,
      date: document.getElementById('editDate').value,
      stars: editSelectedStars,
      review: document.getElementById('editReview').value.trim(),
      image
    };

    saveToStorage();
    renderGrid();
    updateCount();

    // Refresh view panel and switch back
    renderViewPanel(records[idx]);
    switchModalMode('view');
    showToast('✏️ 수정되었습니다');
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
    document.body.style.overflow = '';
    currentModalId = null;
  }

  // Edit panel events (run once)
  document.querySelectorAll('.edit-cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.edit-cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      editSelectedCat = btn.dataset.cat;
    });
  });

  const editStars = document.querySelectorAll('.edit-star');
  editStars.forEach(star => {
    star.addEventListener('click', () => updateEditStars(parseInt(star.dataset.i)));
    star.addEventListener('mouseenter', () => {
      const hov = parseInt(star.dataset.i);
      editStars.forEach(s => { s.style.color = parseInt(s.dataset.i) <= hov ? 'var(--accent)' : 'var(--border)'; });
    });
  });
  document.getElementById('editStarRating').addEventListener('mouseleave', () => updateEditStars(editSelectedStars));

  document.getElementById('editFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      editUploadedImage = ev.target.result;
      const thumb = document.getElementById('editUploadThumb');
      thumb.src = editUploadedImage;
      thumb.style.display = 'block';
      document.getElementById('editUploadPlaceholder').style.display = 'none';
      document.getElementById('editUrl').value = '';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('editUrl').addEventListener('input', (e) => {
    const val = e.target.value.trim();
    if (val) {
      editUploadedImage = null;
      const thumb = document.getElementById('editUploadThumb');
      thumb.src = val;
      thumb.style.display = 'block';
      document.getElementById('editUploadPlaceholder').style.display = 'none';
    }
  });

  document.getElementById('btnSaveEdit').addEventListener('click', saveEdit);
  document.getElementById('modeBtnView').addEventListener('click', () => switchModalMode('view'));
  document.getElementById('modeBtnEdit').addEventListener('click', () => switchModalMode('edit'));

  // Modal close events
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modalBackdrop')) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // ── START ──
  init();
</script>
</body>
</html>
